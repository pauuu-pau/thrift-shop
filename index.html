<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revive | Premium Thrift & Vintage</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1>Revive<span>.</span></h1>
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Search curated vintage pieces...">
        </div>
      </div>
    </header>
    
    <main>
      <section class="hero">
        <h2>Curated Vintage.</h2>
        <p>Discover unique, premium thrifted clothing with rich history and unmatched style.</p>
      </section>

      <section class="grid-container" id="productGrid">
        <!-- Products injected by JS -->
      </section>
    </main>

    <!-- Details Modal -->
    <div class="modal" id="productModal">
      <div class="modal-content">
        <span class="close-btn" id="closeBtn">&times;</span>
        <div class="modal-layout">
          <div class="modal-image-container">
            <img id="modalImage" src="" alt="Product Image">
          </div>
          <div class="modal-details">
            <h2 id="modalTitle">Product Title</h2>
            <p class="modal-price" id="modalPrice">$0.00</p>
            <p class="modal-desc" id="modalDesc">Description goes here.</p>
            <button class="add-to-cart">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
